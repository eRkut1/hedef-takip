<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İpek - Günlük Çalışma Takibi ✨</title>
    <style>
        /* --- VARSAYILAN (KUROMİ) TEMA --- */
        :root {
            --bg-color: #fcf4ff;
            --header-dark: #5a2e70;
            --header-light: #b388c9;
            --accent-color: #ff66a3;
            --text-dark: #333;
            --success-text: #155724;
            --stat-bg-1: #a45aab;
            --stat-bg-2: #d16db9;
        }

        /* --- UĞUR BÖCEĞİ & KARA KEDİ TEMA --- */
        body.theme-ladybug {
            --bg-color: #fff0f0;
            --header-dark: #b30000;
            --header-light: #ff4d4d;
            --accent-color: #29a329; /* Kara Kedi Yeşili */
            --stat-bg-1: #cc0000;
            --stat-bg-2: #e60000;
        }

        /* --- FANTASTİK DÖRTLÜ TEMA --- */
        body.theme-f4 {
            --bg-color: #f0f5ff;
            --header-dark: #003399;
            --header-light: #4da6ff;
            --accent-color: #ff8c00; /* Taş Adam Turuncusu */
            --stat-bg-1: #004080;
            --stat-bg-2: #0066cc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
            transition: background-color 0.5s;
        }

        /* --- ÜST KONTROLLER (TEMA SEÇİCİ) --- */
        .top-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }
        .theme-selector {
            background: white;
            padding: 8px 15px;
            border-radius: 20px;
            border: 2px solid var(--header-dark);
            font-weight: bold;
            color: var(--header-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .theme-selector select {
            border: none;
            background: transparent;
            font-weight: bold;
            color: var(--header-dark);
            outline: none;
            cursor: pointer;
            margin-left: 5px;
        }

        /* --- ANA BAŞLIK --- */
        .main-header {
            text-align: center;
            background-color: var(--header-dark);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.5s;
        }
        .main-header h1 { margin: 0; font-size: 1.5em; }
        .main-header p { margin: 5px 0 0 0; font-size: 1em; opacity: 0.9; }

        /* --- ÜST BİLGİ KARTLARI --- */
        .dashboard-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border: 2px solid var(--header-dark);
            transition: border-color 0.5s;
        }
        .stat-card .title {
            color: white;
            padding: 10px;
            font-weight: bold;
            font-size: 0.9em;
            transition: background-color 0.5s;
        }
        .stat-card .value {
            padding: 15px;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--header-dark);
        }

        /* --- SEKMELER (TABS) --- */
        .tabs { display: flex; gap: 10px; margin-bottom: 0; }
        .tab-btn {
            background-color: rgba(0,0,0,0.05);
            border: 2px solid transparent;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: bold;
            color: var(--header-dark);
            font-size: 1.1em;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--header-dark);
            color: white;
        }
        .tab-content {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 0 12px 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--header-dark);
            transition: border-color 0.5s;
        }
        .tab-content.active { display: block; }

        /* --- VERİ GİRİŞ FORMU --- */
        .tavsiye-karti {
            background-color: rgba(0,0,0,0.02);
            border: 2px dashed var(--header-light);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--header-dark);
            font-size: 1.1em;
            transition: 0.5s;
        }
        .tavsiye-karti span { font-weight: bold; display: block; margin-bottom: 5px; opacity: 0.8; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--header-dark);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--header-light);
            outline: none;
        }
        .ders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn-save {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn-save:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .mascot-icon {
            text-align: center;
            font-size: 4em;
            margin-bottom: 5px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- TABLO --- */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: var(--header-dark); color: white; font-weight: normal; transition: 0.5s; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .row-tatil { background-color: rgba(0,0,0,0.03); color: #555; }
        .status-basarili { color: var(--success-text); font-weight: bold; }
        .status-bekliyor { color: #888; }
        .rozet { font-size: 1.5em; }

        /* --- ROZET MODALI (POP-UP) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px 20px;
            border: 4px solid var(--header-dark);
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: border-color 0.5s;
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-title { color: var(--header-dark); font-size: 1.5em; margin-bottom: 10px; font-weight: bold; }
        .modal-message { color: #555; font-size: 1.1em; margin-bottom: 20px; line-height: 1.4; }
        .big-badge { font-size: 80px; margin: 20px 0; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .btn-close-modal {
            background-color: var(--header-dark);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-close-modal:hover { background-color: var(--header-light); }
    </style>
</head>
<body>

    <div class="top-controls">
        <div class="theme-selector">
            <label for="theme-select">🎨 Tema:</label>
            <select id="theme-select" onchange="degistirTema()">
                <option value="kuromi">Kuromi 💜</option>
                <option value="ladybug">Uğur Böceği & Kara Kedi 🐞</option>
                <option value="f4">Fantastik Dörtlü 🚀</option>
            </select>
        </div>
    </div>

    <!-- ANA BAŞLIK -->
    <div class="main-header">
        <h1><span id="header
