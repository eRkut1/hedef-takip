<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İpek - Günlük Çalışma Takibi 💜✨</title>
    <style>
        :root {
            --bg-color: #fcf4ff;
            --header-dark: #5a2e70;
            --header-light: #b388c9;
            --accent-pink: #ff66a3;
            --text-dark: #333;
            --success-green: #d4edda;
            --success-text: #155724;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- ANA BAŞLIK --- */
        .main-header {
            text-align: center;
            background-color: var(--header-dark);
            color: white;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .main-header h1 { margin: 0; font-size: 1.5em; }
        .main-header p { margin: 5px 0 0 0; font-size: 1em; color: #e0d4e8; }

        /* --- ÜST BİLGİ KARTLARI (ARTIK SADECE TABLO SEKMESİNDE) --- */
        .dashboard-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            flex: 1;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border: 2px solid var(--header-dark);
        }
        .stat-card .title {
            background-color: var(--header-light);
            color: white;
            padding: 10px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .stat-card .value {
            padding: 15px;
            font-size: 1.8em;
            font-weight: bold;
            color: var(--header-dark);
        }

        /* --- SEKMELER (TABS) --- */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 0;
        }
        .tab-btn {
            background-color: #e0d4e8;
            border: none;
            padding: 12px 24px;
            border-radius: 8px 8px 0 0;
            cursor: pointer;
            font-weight: bold;
            color: var(--header-dark);
            font-size: 1.1em;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: var(--header-dark);
            color: white;
        }
        .tab-content {
            display: none;
            background: white;
            padding: 25px;
            border-radius: 0 12px 12px 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--header-dark);
        }
        .tab-content.active {
            display: block;
        }

        /* --- VERİ GİRİŞ FORMU --- */
        .tavsiye-karti {
            background-color: #f0f0fd;
            border: 2px dashed #b388c9;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
            color: var(--header-dark);
            font-size: 1.1em;
        }
        .tavsiye-karti span { font-weight: bold; display: block; margin-bottom: 5px; color: #81469e; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--header-dark);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--header-light);
            outline: none;
        }
        .ders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn-save {
            background-color: var(--accent-pink);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }
        .btn-save:hover {
            background-color: #ff3385;
            transform: translateY(-2px);
        }
        .kuromi-mascot {
            text-align: center;
            font-size: 4em;
            margin-bottom: 5px;
        }

        /* --- TABLO --- */
        .table-container { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: var(--header-dark); color: white; font-weight: normal; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .row-tatil { background-color: #f0f0fd; color: #555; }
        .row-tatil td { border-color: #d8d8f0; }
        .status-basarili { color: var(--success-text); font-weight: bold; }
        .status-bekliyor { color: #888; }
        .rozet { font-size: 1.5em; }

        /* --- ROZET MODALI (POP-UP) --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: white;
            margin: 10% auto;
            padding: 30px 20px;
            border: 4px solid var(--header-dark);
            border-radius: 20px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-title { color: var(--header-dark); font-size: 1.5em; margin-bottom: 10px; font-weight: bold; }
        .modal-message { color: #555; font-size: 1.1em; margin-bottom: 20px; line-height: 1.4; }
        .big-badge { font-size: 80px; margin: 20px 0; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        .btn-close-modal {
            background-color: var(--header-dark);
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-close-modal:hover { background-color: var(--header-light); }
    </style>
</head>
<body>

    <!-- ANA BAŞLIK -->
    <div class="main-header">
        <h1>💜 İPEK - GÜNLÜK ÇALIŞMA TAKİBİ ✨</h1>
        <p>4. Sınıf Çizelgesi</p>
    </div>

    <!-- SEKMELER -->
    <div class="tabs">
        <button class="tab-btn active" onclick="openTab(event, 'tab-giris')">✍️ Bugünün Görevleri</button>
        <button class="tab-btn" onclick="openTab(event, 'tab-tablo')">📊 Tüm Çizelge</button>
    </div>

    <!-- TAB 1: VERİ GİRİŞİ -->
    <div id="tab-giris" class="tab-content active">
        <div class="kuromi-mascot">🐰💜✨</div>
        <h2 style="text-align: center; color: var(--header-dark); margin-top: 0;">Selam İpek! Bugün Neler Yaptık?</h2>
        
        <div class="form-group">
            <label>Hangi Gün İçin Giriyorsun?</label>
            <input type="date" id="input-tarih" onchange="guncelleTavsiye()">
        </div>

        <!-- DİNAMİK TAVSİYE KARTI -->
        <div class="tavsiye-karti" id="tavsiye-kutusu">
            <span>📅 Günün Programı:</span>
            <div id="tavsiye-metni">Yükleniyor...</div>
        </div>

        <div class="ders-grid">
            <div class="form-group"><label>Paragraf</label><input type="number" id="inp-paragraf" min="0" placeholder="0"></div>
            <div class="form-group"><label>Matematik</label><input type="number" id="inp-matematik" min="0" placeholder="0"></div>
            <div class="form-group"><label>Fen Bilimleri</label><input type="number" id="inp-fen" min="0" placeholder="0"></div>
            <div class="form-group"><label>Sosyal Bilgiler</label><input type="number" id="inp-sosyal" min="0" placeholder="0"></div>
            <div class="form-group"><label>Türkçe</label><input type="number" id="inp-turkce" min="0" placeholder="0"></div>
        </div>

        <div class="form-group">
            <label>Ödev Durumu</label>
            <select id="inp-odev">
                <option value="Bekliyor">Seçim Yap...</option>
                <option value="Yapıldı">Yapıldı ✅</option>
                <option value="Ödevsiz Gün">Ödevsiz Gün 🎈</option>
            </select>
        </div>

        <button class="btn-save" onclick="veriyiKaydet()">GÜNÜ KAYDET VE ROZETİNİ AL! ✨</button>
    </div>

    <!-- TAB 2: TABLO (İSTATİSTİKLER BURAYA TAŞINDI) -->
    <div id="tab-tablo" class="tab-content">
        
        <!-- ÜST BİLGİ KARTLARI (Sadece bu sekmede) -->
        <div class="dashboard-header">
            <div class="stat-card">
                <div class="title" style="background-color: #a45aab;">TOPLAM ÇÖZÜLEN</div>
                <div class="value" id="toplam-cozulen-gosterge">0</div>
            </div>
            <div class="stat-card">
                <div class="title" style="background-color: #d16db9;">GÜNLÜK ORTALAMA</div>
                <div class="value" id="gunluk-ortalama-gosterge">0</div>
            </div>
            <div class="stat-card">
                <div class="title" style="background-color: #5a2e70;">TOPLAM HEDEF</div>
                <div class="value">5.040</div>
            </div>
        </div>

        <div class="table-container">
            <table id="main-table">
                <thead>
                    <tr>
                        <th>Tarih</th>
                        <th>Gün</th>
                        <th>Paragraf</th>
                        <th>Matematik</th>
                        <th>Fen Bilimleri</th>
                        <th>Sosyal Bilgiler</th>
                        <th>Türkçe</th>
                        <th style="background-color: #4a1f5c;">Toplam</th>
                        <th>Hedef
